[package]
name = "axiom"
version = "0.1.0"
edition = "2021"
description = "Three-dimensional continuous-trait Particle-Lenia world search"

[dependencies]
rayon = "1"
eframe = { version = "0.35.0", optional = true }

[features]
default = []
viewer = ["dep:eframe"]

[profile.release]
opt-level = 3
lto = "thin"

[lib]
name = "axiom"
path = "src/lib.rs"

# No binaries: main.rs, train.rs and the viewer are gone, and nothing has been written to drive
# the re-authored tuner yet. Re-declare a [[bin]] when there is a source file behind it.
