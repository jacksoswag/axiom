[package]
name = "axiom"
version = "0.1.0"
edition = "2021"
description = "Three-dimensional continuous-trait Particle-Lenia world search"

[dependencies]
rayon = "1"
eframe = { version = "0.35.0", optional = true }

[features]
default = ["viewer"]
viewer = ["dep:eframe"]

[profile.release]
opt-level = 3
lto = "thin"

[lib]
name = "axiom"
path = "src/lib.rs"

[[bin]]
name = "axiom"
path = "src/main.rs"
required-features = ["viewer"]

# Headless. `cargo run --release --bin train --no-default-features` skips eframe entirely.
[[bin]]
name = "train"
path = "src/train.rs"

[[example]]
name = "snapshot"
path = "examples/snapshot.rs"
required-features = ["viewer"]
